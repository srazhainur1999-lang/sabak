<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Қазалы станциясының су мұнарасының (1904–1905) айналдырып көруге болатын 3D моделі: жөндеуге дейін және кейін">
<title>Қазалы су мұнарасы 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}

/* Layout: one full-height viewer — slim header, the model stage filling the middle, a control dock at the bottom; labels float over the canvas */
:root{
  --bg:#11161D; --panel:#19212B; --ink:#F1E9DC; --muted:#A9B3BD; --line:#2D3946;
  --copper:#D08A55; --verdigris:#86C2AF;
  --display:'PT Serif', Georgia, 'Times New Roman', serif;
  --text:'PT Sans', 'Trebuchet MS', Arial, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--text);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;padding:16px clamp(16px,3vw,32px) 12px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--copper);font-weight:700}
h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,3.2vw,30px);line-height:1.15;margin:4px 0 0;text-wrap:balance}
.note{font-size:13px;color:var(--muted);max-width:42ch}
#stage{position:relative;flex:1;min-height:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
#stage canvas:active{cursor:grabbing}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:opacity .25s}
.tag i{width:10px;height:10px;border-radius:50%;background:var(--copper);box-shadow:0 0 0 3px rgba(208,138,85,.28)}
.tag.in i{background:var(--verdigris);box-shadow:0 0 0 3px rgba(134,194,175,.28)}
.tag span{font-size:13px;font-weight:700;background:rgba(17,22,29,.82);border:1px solid var(--line);padding:4px 9px;border-radius:999px;color:var(--ink)}
.dock{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px clamp(16px,3vw,32px) calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel)}
button{font:700 14px/1 var(--text);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer}
button[aria-pressed="true"]{background:var(--copper);border-color:var(--copper);color:#1A120C}
button:hover{border-color:var(--copper)}
button:focus-visible{outline:2px solid var(--verdigris);outline-offset:2px}
.seg{display:flex}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0;border-left:none}
.hint{margin-left:auto;font-size:13px;color:var(--muted)}
#fail[hidden]{display:none}
#fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:560px){.hint{margin-left:0;width:100%}}
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">Әйтеке би кенті · 1904–1905</div>
    <h1>Қазалы станциясының су мұнарасы</h1>
  </div>
  <p class="note">Фотосуреттер бойынша жасалған шартты модель. Пропорциялар көз мөлшерімен алынған.</p>
</header>

<div id="stage">
  <div id="tags"></div>
  <div id="fail" hidden>3D модель жүктелмеді. Бетті жаңартып көріңіз.</div>
</div>

<div class="dock">
  <div class="seg" role="group" aria-label="Мұнараның көрінісі">
    <button id="bAfter" aria-pressed="true">Қазіргі түрі</button>
    <button id="bBefore" aria-pressed="false">Жөндеуге дейін</button>
  </div>
  <button id="bRotate" aria-pressed="true">Айналу</button>
  <button id="bTags" aria-pressed="true">Белгілер</button>
  <button id="bInside" aria-pressed="false">Ішін көру</button>
  <button id="bReset">Бастапқы көрініс</button>
  <span class="hint">Саусақпен не тінтуірмен айналдырыңыз, екі саусақпен жақындатыңыз</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const stage=document.getElementById('stage');
if(!window.THREE||!THREE.OrbitControls){document.getElementById('fail').hidden=false;return;}

/* ---------- renderer / scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.95;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,1,0.5,400);
const HOME={pos:new THREE.Vector3(25,8.5,35),target:new THREE.Vector3(0,11.2,0)};
camera.position.copy(HOME.pos);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.copy(HOME.target);
controls.enableDamping=true;controls.dampingFactor=.07;
controls.minDistance=10;controls.maxDistance=70;
controls.maxPolarAngle=Math.PI*0.495;
controls.enablePan=false;
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotate=!reduce;controls.autoRotateSpeed=1.1;

/* sky: golden-hour gradient */
function skyTex(){
  const c=document.createElement('canvas');c.width=16;c.height=512;
  const g=c.getContext('2d').createLinearGradient(0,0,0,512);
  g.addColorStop(0,'#1B2A3E');g.addColorStop(.55,'#4E6680');g.addColorStop(.82,'#C9A27A');g.addColorStop(1,'#E2BB8C');
  const x=c.getContext('2d');x.fillStyle=g;x.fillRect(0,0,16,512);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;
}
scene.background=skyTex();
scene.fog=new THREE.Fog(0xB8916A,60,150);

scene.add(new THREE.HemisphereLight(0xA9C2DE,0x6B5640,0.6));
const sun=new THREE.DirectionalLight(0xFFD9AE,1.55);
sun.position.set(14,20,12);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-14,right:14,top:26,bottom:-4,near:1,far:70});
sun.shadow.bias=-0.0006;
scene.add(sun);
const rim=new THREE.DirectionalLight(0x8FB4D8,0.35);rim.position.set(-15,10,-12);scene.add(rim);

/* ground */
const ground=new THREE.Mesh(new THREE.CircleGeometry(80,64),new THREE.MeshStandardMaterial({color:0x8C7253,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

/* ---------- dimensions (model units) ---------- */
const BASE_H=0.9, SHAFT_H=16, R_BOT=3.15, R_TOP=2.95;
const SHAFT_TOP=BASE_H+SHAFT_H; // 16.9
const rAt=y=>R_BOT-(y-BASE_H)/SHAFT_H*(R_BOT-R_TOP);
const yFromTop=t=>SHAFT_TOP-t; // t = units measured down from the top of the shaft

/* ---------- two looks: before and after the renovation ---------- */
const LOOKS={
  before:{
    mortar:'#DCCFB2', brick:[38,6,30,12,62,12], brickLow:null, stone:'#D9CDB2', stoneD:'#B9AA8A', band:'#5C4334', dark:'#2A221D',
    frieze:'#CBBD9C', mShadow:'#9E8D6E', mLine:'#EAE0C8', niche:'#B59D77', lattice:true, faint:'rgba(110,82,58,.55)',
    stone3:0xD6C9AC, band3:0x5C4334, plinth3:0x9C8567
  },
  after:{
    mortar:'#E9D6C6', brick:[22,6,50,10,64,8], brickLow:[11,5,44,10,59,8], stone:'#EFE6D5', stoneD:'#DCCDB6', band:'#474B50', dark:'#26303C',
    frieze:'#EFE5D2', mShadow:'#C4B49B', mLine:'#FBF6EC', niche:'#D9A98B', lattice:false, faint:'rgba(150,96,74,.45)',
    stone3:0xEDE3D1, band3:0x121417, plinth3:0xB98C7A
  }
};

/* ---------- shaft texture (painted façade) ---------- */
const W=2048,H=1728,S=H/SHAFT_H; // px per unit vertically
const col=document.createElement('canvas');col.width=W;col.height=H;
const bmp=document.createElement('canvas');bmp.width=W;bmp.height=H;
const c=col.getContext('2d'), b=bmp.getContext('2d');
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const CH=8, BL=24;

function paintFacade(P){
  seed=7;
  const STONE=P.stone, STONE_D=P.stoneD, BAND=P.band, DARK=P.dark;
  const LOW_FROM=7.7*S;
  c.fillStyle=P.mortar;c.fillRect(0,0,W,H);b.fillStyle='#3a3a3a';b.fillRect(0,0,W,H);
  for(let r=0,y=0;y<H;r++,y+=CH){
    const off=(r%2)*BL/2, B=(P.brickLow&&y>LOW_FROM)?P.brickLow:P.brick;
    for(let x=-BL+off;x<W;x+=BL){
      const h=B[0]+rnd()*B[1], s=B[2]+rnd()*B[3], l=B[4]+rnd()*B[5];
      c.fillStyle=`hsl(${h},${s}%,${l}%)`;c.fillRect(x+1,y+1,BL-1.5,CH-1.5);
      b.fillStyle=`rgb(${190+rnd()*30|0},${190+rnd()*30|0},${190+rnd()*30|0})`;b.fillRect(x+1,y+1,BL-1.5,CH-1.5);
    }
  }
  function paint(fn){fn(c,false);fn(b,true);}
  function band(t,th,color){const y=t*S;c.fillStyle=color;c.fillRect(0,y,W,th*S);b.fillStyle='#e6e6e6';b.fillRect(0,y,W,th*S);}
  function faint(t){c.fillStyle=P.faint;c.fillRect(0,t*S,W,4);}

  [10.2,10.9,11.6,12.3,13.0,14.3,15.0].forEach(faint);
  c.fillStyle='rgba(90,66,48,.18)';c.fillRect(0,15.4*S,W,0.6*S);

  // meander frieze (top band)
  (function(){
    const y1=1.12*S; c.fillStyle=P.frieze;c.fillRect(0,0,W,y1);b.fillStyle='#b4b4b4';b.fillRect(0,0,W,y1);
    c.fillStyle=STONE;c.fillRect(0,0,W,12);c.fillRect(0,y1-14,W,14);
    b.fillStyle='#f0f0f0';b.fillRect(0,0,W,12);b.fillRect(0,y1-14,W,14);
    const n=26,uw=W/n,gx=uw/5,gy=16,top=24;
    const pts=[[0,4],[0,0],[4,0],[4,3],[2,3],[2,2],[3,2],[3,1],[1,1],[1,4],[5,4]];
    for(let pass=0;pass<3;pass++){
      const ctx=pass===2?b:c;
      ctx.lineWidth=9;ctx.lineJoin='miter';ctx.lineCap='square';
      ctx.strokeStyle=pass===0?P.mShadow:pass===1?P.mLine:'#ffffff';
      const dy=pass===0?3:0;
      for(let i=-1;i<=n;i++){
        ctx.beginPath();
        pts.forEach((p,k)=>{const x=i*uw+p[0]*gx, y=top+p[1]*gy+dy; k?ctx.lineTo(x,y):ctx.moveTo(x,y);});
        ctx.stroke();
      }
    }
  })();
  band(1.12,0.13,BAND);
  c.fillStyle=STONE;c.fillRect(0,1.25*S,W,6);

  // arcature: pointed blind arches with a few dark slit windows
  (function(){
    const n=18,w=W/n,y0=1.3*S+2,y1=y0+1.12*S;
    function lancet(ctx,cx,hw,top,bot){ctx.beginPath();ctx.moveTo(cx-hw,bot);ctx.lineTo(cx-hw,top+hw*1.3);ctx.quadraticCurveTo(cx-hw,top+hw*.25,cx,top);ctx.quadraticCurveTo(cx+hw,top+hw*.25,cx+hw,top+hw*1.3);ctx.lineTo(cx+hw,bot);ctx.closePath();}
    for(let i=-1;i<=n;i++){
      const cx=(i+0.5)*w, tx=i*w;
      c.fillStyle=STONE;c.fillRect(tx-14,y0,28,26);c.fillRect(tx-8,y0+26,16,18);
      b.fillStyle='#f4f4f4';b.fillRect(tx-14,y0,28,26);b.fillRect(tx-8,y0+26,16,18);
      c.fillStyle='rgba(60,40,25,.35)';lancet(c,cx+3,33,y0+6,y1+4);c.fill();
      c.fillStyle=STONE;lancet(c,cx,33,y0+2,y1);c.fill();
      b.fillStyle='#ffffff';lancet(b,cx,33,y0+2,y1);b.fill();
      const win=(i%3===0);
      c.fillStyle=win?DARK:P.niche;lancet(c,cx,21,y0+16,y1);c.fill();
      b.fillStyle=win?'#000':'#707070';lancet(b,cx,21,y0+16,y1);b.fill();
      c.fillStyle=STONE_D;c.fillRect(cx-36,y1-2,72,10);
    }
  })();

  band(4.70,0.12,BAND);c.fillStyle=STONE;c.fillRect(0,4.82*S,W,5);

  // arched window: lattice before the renovation, new glazing after
  function archWindow(cx){
    const top=4.98*S, bot=6.92*S, hw=0.58*S/2+10, iw=0.58*S/2;
    paint((ctx,isB)=>{
      ctx.fillStyle=isB?'#ffffff':STONE;
      ctx.beginPath();ctx.moveTo(cx-hw-14,top+hw+6);ctx.arc(cx,top+hw+6,hw+14,Math.PI,0);ctx.lineTo(cx+hw+14,top+hw+40);ctx.lineTo(cx+hw,top+hw+40);ctx.lineTo(cx+hw,top+hw+6);ctx.arc(cx,top+hw+6,hw,0,Math.PI,true);ctx.lineTo(cx-hw,top+hw+40);ctx.lineTo(cx-hw-14,top+hw+40);ctx.closePath();ctx.fill();
      ctx.fillStyle=isB?'#000':DARK;
      ctx.beginPath();ctx.moveTo(cx-iw,bot);ctx.lineTo(cx-iw,top+hw+10);ctx.arc(cx,top+hw+10,iw,Math.PI,0);ctx.lineTo(cx+iw,bot);ctx.closePath();ctx.fill();
      if(!isB){
        ctx.save();ctx.clip();
        if(P.lattice){
          ctx.strokeStyle='#6E5B4A';ctx.lineWidth=2.5;
          for(let k=-12;k<14;k++){ctx.beginPath();ctx.moveTo(cx-iw+k*12,top+hw+40);ctx.lineTo(cx-iw+k*12+120,bot);ctx.stroke();ctx.beginPath();ctx.moveTo(cx+iw-k*12,top+hw+40);ctx.lineTo(cx+iw-k*12-120,bot);ctx.stroke();}
          ctx.fillStyle='#6E5B4A';ctx.fillRect(cx-iw,top+hw+36,iw*2,4);
        }else{
          const g=ctx.createLinearGradient(cx-iw,0,cx+iw,0);g.addColorStop(0,'rgba(150,180,210,.10)');g.addColorStop(.45,'rgba(190,215,235,.35)');g.addColorStop(1,'rgba(150,180,210,.05)');
          ctx.fillStyle=g;ctx.fillRect(cx-iw,top,iw*2,bot-top);
          ctx.fillStyle='#E9E4DA';ctx.fillRect(cx-3,top,6,bot-top);ctx.fillRect(cx-iw,top+hw+60,iw*2,5);
        }
        ctx.restore();
      }
      ctx.fillStyle=isB?'#f2f2f2':STONE;
      const sw=0.95*S/2;ctx.fillRect(cx-sw,bot,sw*2,12);
      ctx.fillRect(cx-sw,bot+12,18,22);ctx.fillRect(cx+sw-18,bot+12,18,22);ctx.fillRect(cx-9,bot+12,18,22);
      ctx.fillRect(cx-sw,bot+34,sw*2,8);
    });
  }
  archWindow(W/2);archWindow(0);archWindow(W);

  band(7.45,0.1,BAND);c.fillStyle=STONE;c.fillRect(0,7.56*S,W,5);band(7.66,0.1,BAND);

  // round window (oculus) in a square stone frame
  (function(cx){
    const cy=8.45*S, fs=0.98*S/2, r=0.37*S;
    paint((ctx,isB)=>{
      ctx.fillStyle=isB?'#ffffff':STONE;ctx.fillRect(cx-fs,cy-fs,fs*2,fs*2);
      ctx.fillStyle=isB?'#cfcfcf':STONE_D;ctx.fillRect(cx-fs+8,cy-fs+8,fs*2-16,fs*2-16);
      ctx.fillStyle=isB?'#ffffff':STONE;ctx.beginPath();ctx.arc(cx,cy,r+8,0,7);ctx.fill();
      ctx.fillStyle=isB?'#000':DARK;ctx.beginPath();ctx.arc(cx,cy,r-4,0,7);ctx.fill();
      if(!isB){
        ctx.strokeStyle=P.lattice?'#7A6654':'#E9E4DA';ctx.lineWidth=3;
        const n=P.lattice?8:4;
        for(let k=0;k<n;k++){const a=k*Math.PI*2/n;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*(r-4),cy+Math.sin(a)*(r-4));ctx.stroke();}
        if(P.lattice){ctx.beginPath();ctx.arc(cx,cy,r*0.35,0,7);ctx.stroke();}
      }
    });
  })(W/2);
  band(9.02,0.11,BAND);band(9.2,0.08,BAND);
  band(13.62,0.1,BAND);
}
paintFacade(LOOKS.after);

/* ---------- materials ---------- */
const shaftMap=new THREE.CanvasTexture(col);shaftMap.encoding=THREE.sRGBEncoding;shaftMap.anisotropy=renderer.capabilities.getMaxAnisotropy();
const shaftBump=new THREE.CanvasTexture(bmp);
const shell=[];// exterior materials (for the see-through mode)
function mat(o){const m=new THREE.MeshStandardMaterial(o);shell.push(m);return m;}
const mShaft=mat({map:shaftMap,bumpMap:shaftBump,bumpScale:0.045,roughness:.92});
const mStone=mat({color:LOOKS.after.stone3,roughness:.9});
const mBand=mat({color:LOOKS.after.band3,roughness:.6,metalness:.3});
const mPlinth=mat({color:LOOKS.after.plinth3,roughness:.95});

function domeTex(){
  const cv=document.createElement('canvas');cv.width=512;cv.height=512;const x=cv.getContext('2d');
  x.fillStyle='#8A5A3C';x.fillRect(0,0,512,512);
  for(let i=0;i<220;i++){const px=rnd()*512,w=2+rnd()*8;x.fillStyle=rnd()<.25?'rgba(96,130,112,.22)':'rgba(55,32,20,.18)';x.fillRect(px,rnd()*200,w,180+rnd()*330);}
  const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;return t;
}
// before: copper dome
const mDome=mat({map:domeTex(),roughness:.5,metalness:.45});
const mRib=mat({color:0x5E3B26,roughness:.55,metalness:.4});
const mLantern=mat({color:0x6F8C83,roughness:.6,metalness:.25});
const mLanternRoof=mat({color:0x4F6A63,roughness:.55,metalness:.35});
const mGlass=mat({color:0x1C2228,roughness:.2,metalness:.6});
// after: dark metal roof with light seams
const mRoof=mat({color:0x07080A,roughness:.62,metalness:.2,flatShading:true});
const mSeam=mat({color:0xDADDE0,roughness:.5,metalness:.2});
const mDisc=mat({color:0xF3F1EC,roughness:.6});

/* ---------- exterior ---------- */
const tower=new THREE.Group();scene.add(tower);
function add(geo,m,y,ry,parent){const o=new THREE.Mesh(geo,m);o.position.y=y;if(ry)o.rotation.y=ry;o.castShadow=true;o.receiveShadow=true;(parent||tower).add(o);return o;}

add(new THREE.CylinderGeometry(3.3,3.38,BASE_H,96),mPlinth,BASE_H/2);
add(new THREE.CylinderGeometry(3.24,3.3,0.14,96),mStone,BASE_H-0.05);
add(new THREE.CylinderGeometry(R_TOP,R_BOT,SHAFT_H,160,1,true),mShaft,BASE_H+SHAFT_H/2,Math.PI);
[[1.18,.14],[4.76,.13],[7.5,.11],[7.71,.11],[9.07,.12],[9.24,.09],[13.67,.11]].forEach(([t,h])=>{const y=yFromTop(t),r=rAt(y)+0.035;add(new THREE.CylinderGeometry(r,r,h,128),mBand,y);});
add(new THREE.CylinderGeometry(rAt(yFromTop(1.27))+0.03,rAt(yFromTop(1.27))+0.03,0.06,128),mStone,yFromTop(1.27));
add(new THREE.CylinderGeometry(3.1,3.0,0.32,128),mStone,SHAFT_TOP+0.16);
add(new THREE.CylinderGeometry(3.24,3.18,0.14,128),mStone,SHAFT_TOP+0.39);
add(new THREE.CylinderGeometry(2.86,2.95,0.3,128),mStone,SHAFT_TOP+0.6);
const DOME_Y=SHAFT_TOP+0.75, DR=2.78, DH=2.15, TH_END=1.29;

// roof before the renovation: ribbed copper dome with a glazed lantern
const roofOld=new THREE.Group();tower.add(roofOld);
const prof=[];for(let i=0;i<=40;i++){const th=TH_END*i/40;prof.push(new THREE.Vector2(DR*Math.cos(th),DH*Math.sin(th)));}
add(new THREE.LatheGeometry(prof,96),mDome,DOME_Y,0,roofOld);
for(let k=0;k<16;k++){
  const a=k/16*Math.PI*2;const pts=[];
  for(let i=0;i<=24;i++){const th=TH_END*i/24;const r=DR*Math.cos(th)+0.03;pts.push(new THREE.Vector3(Math.sin(a)*r,DOME_Y+DH*Math.sin(th)+0.01,Math.cos(a)*r));}
  const m=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),40,0.035,6),mRib);m.castShadow=true;roofOld.add(m);
}
(function(){
  const th=0.78,r=DR*Math.cos(th),y=DOME_Y+DH*Math.sin(th);
  const n=new THREE.Vector3(0,Math.sin(th)/DH,Math.cos(th)/DR).normalize();
  const g=new THREE.Group();g.position.set(0,y,r);g.lookAt(new THREE.Vector3(0,y,r).add(n));
  g.add(new THREE.Mesh(new THREE.TorusGeometry(0.24,0.06,10,32),mStone));
  const glass=new THREE.Mesh(new THREE.CircleGeometry(0.2,24),mGlass);glass.position.z=-0.02;g.add(glass);
  roofOld.add(g);
})();
const LY=DOME_Y+DH*Math.sin(TH_END);
add(new THREE.CylinderGeometry(0.84,0.84,0.12,8),mLanternRoof,LY+0.02,0,roofOld);
add(new THREE.CylinderGeometry(0.76,0.78,0.85,8),mLantern,LY+0.5,0,roofOld);
for(let k=0;k<8;k++){const a=(k+0.5)/8*Math.PI*2;const p=new THREE.Mesh(new THREE.PlaneGeometry(0.36,0.5),mGlass);p.position.set(Math.sin(a)*0.75,LY+0.52,Math.cos(a)*0.75);p.rotation.y=a;roofOld.add(p);}
add(new THREE.CylinderGeometry(0.62,1.08,0.24,8),mLanternRoof,LY+1.05,0,roofOld);
add(new THREE.CylinderGeometry(0.34,0.5,0.16,8),mLanternRoof,LY+1.25,0,roofOld);
add(new THREE.CylinderGeometry(0.035,0.05,1.3,8),mRib,LY+1.95,0,roofOld);

// roof after the renovation: eight-sided dark metal roof, light seams, white disc, small capped top
const roofNew=new THREE.Group();tower.add(roofNew);
const NR=2.82, NH=1.95, NTOP=0.66, NTH=Math.acos(NTOP/NR), FACETS=8, ROT=Math.PI/FACETS;
const nprof=[];for(let i=0;i<=24;i++){const th=NTH*i/24;nprof.push(new THREE.Vector2(NR*Math.cos(th),NH*Math.sin(th)/Math.sin(NTH)));}
add(new THREE.LatheGeometry(nprof,FACETS),mRoof,DOME_Y,ROT,roofNew);
for(let k=0;k<FACETS;k++){
  const a=ROT+k/FACETS*Math.PI*2;const pts=[];
  nprof.forEach(p=>pts.push(new THREE.Vector3(Math.sin(a)*(p.x+0.02),DOME_Y+p.y+0.015,Math.cos(a)*(p.x+0.02))));
  const m=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),30,0.045,6),mSeam);m.castShadow=true;roofNew.add(m);
}
add(new THREE.CylinderGeometry(NR+0.04,NR+0.06,0.1,FACETS),mSeam,DOME_Y+0.05,ROT,roofNew);
(function(){ // white disc on the front facet
  const th=NTH*0.62, flat=Math.cos(Math.PI/FACETS);
  const r=NR*Math.cos(th)*flat, y=DOME_Y+NH*Math.sin(th)/Math.sin(NTH);
  const K=NH/Math.sin(NTH); const n=new THREE.Vector3(0,Math.sin(th)/K,Math.cos(th)/NR).normalize();
  const g=new THREE.Group();g.position.set(0,y,r+0.03);g.lookAt(new THREE.Vector3(0,y,r+0.03).add(n));
  g.add(new THREE.Mesh(new THREE.CircleGeometry(0.34,32),mDisc));
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.34,0.035,8,32),mSeam);g.add(ring);
  roofNew.add(g);
})();
const NY=DOME_Y+NH;
add(new THREE.CylinderGeometry(NTOP-0.04,NTOP+0.02,0.42,FACETS),mRoof,NY+0.21,ROT,roofNew);
add(new THREE.CylinderGeometry(NTOP+0.06,NTOP+0.06,0.07,FACETS),mSeam,NY+0.03,ROT,roofNew);
add(new THREE.CylinderGeometry(NTOP+0.1,NTOP+0.02,0.09,FACETS),mSeam,NY+0.46,ROT,roofNew);
add(new THREE.CylinderGeometry(0.25,NTOP-0.02,0.2,FACETS),mRoof,NY+0.6,ROT,roofNew);
add(new THREE.CylinderGeometry(0.03,0.045,0.7,8),mRoof,NY+1.0,0,roofNew);

let look='after';
function setLook(k){
  look=k;const P=LOOKS[k];
  paintFacade(P);shaftMap.needsUpdate=true;shaftBump.needsUpdate=true;
  mStone.color.setHex(P.stone3);mBand.color.setHex(P.band3);mPlinth.color.setHex(P.plinth3);
  roofOld.visible=k==='before';roofNew.visible=k==='after';
}
setLook('after');

/* ---------- interior (see-through mode) ---------- */
const inside=new THREE.Group();inside.visible=false;scene.add(inside);
const mTank=new THREE.MeshStandardMaterial({color:0x7B848D,roughness:.45,metalness:.7});
const mIron=new THREE.MeshStandardMaterial({color:0x2E2B29,roughness:.6,metalness:.6});
const mGauge=new THREE.MeshStandardMaterial({color:0xD08A55,roughness:.5,metalness:.3});
function tank(y0,y1){
  const h=y1-y0,g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(2.25,2.25,h,64),mTank));
  [-.5,0,.5].forEach(f=>{const r=new THREE.Mesh(new THREE.TorusGeometry(2.27,0.04,8,64),mIron);r.rotation.x=Math.PI/2;r.position.y=f*h*.9;g.add(r);});
  const gauge=new THREE.Mesh(new THREE.BoxGeometry(0.12,h*.85,0.06),mGauge);gauge.position.set(0,0,2.3);g.add(gauge);
  g.position.y=(y0+y1)/2;inside.add(g);
}
tank(13.3,16.3);tank(9.6,12.7);
const riser=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,15.6,16),mIron);riser.position.set(1.7,8.3,-0.9);inside.add(riser);
const post=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,8.6,16),mIron);post.position.set(-0.4,BASE_H+4.3,0.3);inside.add(post);
for(let i=0;i<38;i++){
  const a=i*0.42,y=BASE_H+0.2+i*0.215;
  const st=new THREE.Mesh(new THREE.BoxGeometry(1.25,0.05,0.42),mIron);
  st.position.set(-0.4+Math.cos(a)*0.68,y,0.3-Math.sin(a)*0.68);st.rotation.y=a;inside.add(st);
}

/* ---------- labels ---------- */
const tagsEl=document.getElementById('tags');
const TAGS=[
  {t:'Жаңа шатыр',p:[0,DOME_Y+1.35,1.95],front:true},
  {t:'Меандр өрнекті белдеу',p:[0,yFromTop(0.55),3.0],front:true},
  {t:'Сүйір доғалы фриз',p:[0,yFromTop(1.9),3.0],front:true},
  {t:'Доғалы терезе',p:[0,yFromTop(5.9),3.05],front:true},
  {t:'Дөңгелек терезе',p:[0,yFromTop(8.45),3.1],front:true},
  {t:'Екі су резервуары',p:[2.25,12.9,0],inside:true},
  {t:'Бұрандалы шойын баспалдақ',p:[-0.4,4.6,0.3],inside:true},
];
TAGS.forEach(o=>{o.v=new THREE.Vector3(...o.p);o.el=document.createElement('div');o.el.className='tag'+(o.inside?' in':'');o.el.innerHTML='<i></i><span></span>';o.el.lastChild.textContent=o.t;tagsEl.appendChild(o.el);});
let showTags=true, seeInside=false;
const tmp=new THREE.Vector3(), camDir=new THREE.Vector3();
function placeTags(){
  const w=stage.clientWidth,h=stage.clientHeight;
  TAGS.forEach(o=>{
    let vis=showTags&&(o.inside?seeInside:true);
    if(vis&&o.front){camDir.copy(camera.position).sub(o.v);vis=camDir.dot(tmp.set(o.v.x,0,o.v.z).normalize())>0;}
    tmp.copy(o.v).project(camera);
    const x=(tmp.x*.5+.5)*w-5,y=(-tmp.y*.5+.5)*h-5;
    o.el.style.transform=`translate(${x}px,${y}px)`;
    o.el.style.opacity=vis?1:0;
  });
}

/* ---------- controls ---------- */
const bRotate=document.getElementById('bRotate'),bTags=document.getElementById('bTags'),bInside=document.getElementById('bInside');
bRotate.setAttribute('aria-pressed',String(controls.autoRotate));
bRotate.onclick=()=>{controls.autoRotate=!controls.autoRotate;bRotate.setAttribute('aria-pressed',String(controls.autoRotate));};
bTags.onclick=()=>{showTags=!showTags;bTags.setAttribute('aria-pressed',String(showTags));};
bInside.onclick=()=>{
  seeInside=!seeInside;bInside.setAttribute('aria-pressed',String(seeInside));
  inside.visible=seeInside;
  shell.forEach(m=>{m.transparent=seeInside;m.opacity=seeInside?0.16:1;m.depthWrite=!seeInside;m.needsUpdate=true;});
  tower.traverse(o=>{if(o.isMesh)o.castShadow=!seeInside;});
};
const bAfter=document.getElementById('bAfter'),bBefore=document.getElementById('bBefore');
function applyLook(k){
  setLook(k);
  TAGS[0].el.lastChild.textContent=k==='after'?'Жаңа шатыр':'Мыс күмбез бен фонарь';
  bAfter.setAttribute('aria-pressed',String(k==='after'));bBefore.setAttribute('aria-pressed',String(k==='before'));
}
bAfter.onclick=()=>applyLook('after');bBefore.onclick=()=>applyLook('before');
if(location.hash==='#before')applyLook('before');
document.getElementById('bReset').onclick=()=>{camera.position.copy(HOME.pos);controls.target.copy(HOME.target);controls.update();};

/* ---------- size + loop ---------- */
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
  renderer.setSize(w,h,false);camera.aspect=w/h;
  // keep the whole tower in frame on narrow screens
  camera.fov=w/h<0.8?38:34;camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);resize();
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);placeTags();});
})();
</script>

</body>
</html>
